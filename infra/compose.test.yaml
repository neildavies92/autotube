name: autotube-v2-test
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: autotube_test
      POSTGRES_PASSWORD: autotube_test
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autotube_test -d postgres']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
